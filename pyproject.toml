[project]
name = "kiwi-araga-bot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "litellm>=1.90.2",
    "python-dotenv>=1.2.2",
    "python-telegram-bot>=21",
    "telegramify-markdown>=1.2.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]  # длинные строки — литералы промптов персонажа, не логика
